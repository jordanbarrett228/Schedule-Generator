# ============================================================================
# Cloudflare Tunnel Configuration Example
# ============================================================================
# Copy this file to: C:\Users\<username>\.cloudflared\config.yml
# (Replace <username> with your Windows username)
#
# Then update the tunnel ID and credentials file path below.
# ============================================================================

# Your tunnel ID (get this from: cloudflared tunnel list)
tunnel: YOUR-TUNNEL-ID-HERE

# Path to credentials file (created when you run: cloudflared tunnel create)
# Windows: C:\Users\<username>\.cloudflared\<tunnel-id>.json
# Mac/Linux: ~/.cloudflared/<tunnel-id>.json
credentials-file: C:\Users\illus\.cloudflared\YOUR-TUNNEL-ID-HERE.json

# Ingress rules (how traffic is routed)
ingress:
  # Option 1: With custom domain (requires Cloudflare DNS)
  # - hostname: schedule.yourdomain.com
  #   service: http://localhost:8000
  #   originRequest:
  #     noTLSVerify: true

  # Option 2: Without domain (uses Cloudflare-generated URL)
  # This is the simplest option - just point all traffic to localhost:8000
  - service: http://localhost:8000
    originRequest:
      noTLSVerify: true

# ============================================================================
# Quick Setup Steps:
# ============================================================================
# 1. Install cloudflared:
#    winget install --id Cloudflare.cloudflared
#
# 2. Login to Cloudflare:
#    cloudflared tunnel login
#
# 3. Create tunnel:
#    cloudflared tunnel create schedule-generator
#    (Note the tunnel ID that gets printed!)
#
# 4. Copy this file to ~/.cloudflared/config.yml and update:
#    - Replace YOUR-TUNNEL-ID-HERE with actual tunnel ID
#    - Replace path to credentials file
#
# 5. Start tunnel:
#    cloudflared tunnel run schedule-generator
#
# 6. Get your public URL:
#    cloudflared tunnel info schedule-generator
# ============================================================================
